version: 2
updates:
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: monthly
      open-pull-requests-limit: 10
      target-branch: "trunk"

    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: monthly
      open-pull-requests-limit: 10
      target-branch: "trunk"

    - package-ecosystem: composer
      directory: '/'
      schedule:
          interval: monthly
      open-pull-requests-limit: 10
      target-branch: "trunk"